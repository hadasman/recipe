<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="recipe.css"/>
    
    <!-- Universal Icons for All Devices -->
    <link rel="icon" type="image/png" href="thumbnail.png">
    <link rel="apple-touch-icon" href="thumbnail.png">
    <link rel="shortcut icon" href="thumbnail.png">

    
    <!-- Android/Chrome -->
    <link rel="icon" sizes="192x192" href="thumbnail.png">
    <link rel="icon" sizes="512x512" href="thumbnail.png">
    
    <!-- iOS -->
    <link rel="apple-touch-icon" sizes="180x180" href="thumbnail.png">
    
    <!-- Windows Tiles -->
    <meta name="msapplication-TileColor" content="#fbe7b2">
    <meta name="msapplication-TileImage" content="thumbnail.png">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#fbe7b2">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Recipe Organizer">
    <title>Recipe Organizer - Step by Step Guide</title>
</head>

<body>

<div class="container">
    <h1>Recipe Organizer</h1>
    
    <div class="upload-section">
        <div class="file-controls">
            <div class="dropdown-control">
                <select id="recipeSelect" class="recipe-dropdown">
                    <option value="">Choose a recipe...</option>
                </select>
            </div>
        </div>
        <!-- Hidden file input for upload functionality -->
        <input type="file" name="file" id="customFileButton" accept="*/*" style="display: none;">

    </div>

    <script src="./recipe.js"></script>
</div>

</body>

</html>
