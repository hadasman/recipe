<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="recipe.css"/>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#fbe7b2">
    <title>Recipe Organizer - Step by Step Guide</title>
</head>

<body>

<div class="container">
    <h1>Recipe Organizer</h1>
    
    <div class="upload-section">
        <h2>Recipe Files</h2>
        <div class="file-controls">
            <div class="upload-control">
                <label for="customFileButton">Upload Recipe File:</label>
                <input type="file" name="file" id="customFileButton">
            </div>
            
            <div class="dropdown-control">
                <label for="recipeSelect">Or choose from available recipes:</label>
                <select id="recipeSelect" class="recipe-dropdown">
                    {{DROPDOWN_OPTIONS}}
                </select>
            </div>
        </div>
    </div>

    <script src="./recipe.js"></script>
</div>

</body>

</html>
